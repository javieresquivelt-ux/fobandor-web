{% extends 'backoffice/base_backoffice.html' %}
{% load i18n %}

{% block content %}
<div class="max-w-xl">
  <h1 class="text-2xl font-extrabold mb-4">{% trans "Eliminar Proyecto" %}</h1>
  <p class="text-gray-600 dark:text-gray-400 mb-6">
    {% trans "¿Seguro que deseas eliminar el proyecto" %} <strong>{{ object.title_es }}</strong>?
  </p>
  <form method="post" class="flex gap-3">
    {% csrf_token %}
    <button type="submit" class="rounded-xl bg-fobandor-orange hover:bg-fobandor-orange/90 text-white px-5 py-2.5 text-sm font-semibold">{% trans "Eliminar" %}</button>
    <a href="{% url 'backoffice:project-list' %}" class="rounded-xl border border-gray-300 dark:border-white/20 px-5 py-2.5 text-sm font-semibold">{% trans "Cancelar" %}</a>
  </form>
</div>
{% endblock %}
