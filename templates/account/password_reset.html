{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="max-w-md mx-auto py-16 px-4">
  <h1 class="text-3xl font-extrabold mb-6 text-center">{% trans "Restablecer contraseña" %}</h1>
  <form method="post" action="{% url 'account_reset_password' %}" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-semibold mb-1">{{ form.email.label }}</label>
      <input type="email" name="{{ form.email.html_name }}" id="{{ form.email.id_for_label }}"
             value="{{ form.email.value|default:'' }}"
             class="w-full rounded-xl border border-gray-300 dark:border-white/20 px-3.5 py-2.5 bg-white dark:bg-white/5 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:border-fobandor-orange focus:ring-1 focus:ring-fobandor-orange transition-colors"
             placeholder="{{ form.email.label }}"
             {% if form.email.field.required %}required{% endif %} autocomplete="email">
      {% if form.email.errors %}<p class="mt-1 text-xs text-fobandor-orange">{{ form.email.errors|join:", " }}</p>{% endif %}
    </div>
    <button type="submit" class="w-full rounded-xl bg-fobandor-orange hover:bg-fobandor-orange/90 text-white px-4 py-2.5 font-semibold">
      {% trans "Enviar enlace" %}
    </button>
  </form>
</div>
{% endblock %}
