{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="max-w-md mx-auto py-16 px-4">
  <h1 class="text-3xl font-extrabold mb-6 text-center">{% trans "Restablecer contraseña" %}</h1>
  <form method="post" action="{% url 'account_reset_password' %}" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-semibold mb-1">{{ form.email.label }}</label>
      {{ form.email }}
    </div>
    <button type="submit" class="w-full rounded-xl bg-fobandor-orange hover:bg-fobandor-orange/90 text-white px-4 py-2.5 font-semibold">
      {% trans "Enviar enlace" %}
    </button>
  </form>
</div>
{% endblock %}
